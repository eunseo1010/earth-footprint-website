<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="몇 가지 질문에 답하고 당신이 만나게 될 미래의 지구를 확인해보세요."
    />
    <title>Earth, After?</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-width: 320px;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: #101510;
      }

      .hero {
        position: relative;
        width: 100%;
        min-height: 100vh;
        min-height: 100svh;
        overflow: hidden;
        isolation: isolate;
      }

      .background,
      .background__slide,
      .background__shade {
        position: absolute;
        inset: 0;
      }

      .background {
        z-index: -1;
        background: #182017;
      }

      .background__slide {
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        filter: blur(8px);
        opacity: 0;
        transition: opacity 1.6s ease-in-out, filter 1.6s ease-in-out;
        will-change: opacity;
      }

      .background__slide.is-active {
        filter: blur(0);
        opacity: 1;
      }

      .background__shade {
        width: 100%;
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.78) 0%,
          rgba(0, 0, 0, 0.54) 52%,
          rgba(0, 0, 0, 0.34) 100%
        );
        pointer-events: none;
      }

      .hero__content {
        position: absolute;
        inset: 0;
        color: #fff;
      }

      .hero__intro,
      .hero__title,
      .hero__tagline,
      .hero__action {
        position: absolute;
        left: 90px;
        margin: 0;
      }

      .hero__intro {
        top: 21.5vh;
        width: min(460px, calc(100vw - 48px));
        font-size: 24px;
        font-weight: 400;
        line-height: 1.25;
        letter-spacing: -0.035em;
      }

      .hero__title {
        top: 38vh;
        width: min(460px, calc(100vw - 48px));
        font-size: 76px;
        font-weight: 700;
        line-height: 1.16;
        letter-spacing: -0.06em;
        white-space: nowrap;
      }

      .hero__tagline {
        top: 51.8vh;
        width: min(460px, calc(100vw - 48px));
        font-size: 30px;
        font-weight: 600;
        line-height: 1.25;
        letter-spacing: -0.045em;
      }

      .hero__action {
        top: 61.3vh;
        display: flex;
        width: 277px;
        height: 52px;
        align-items: center;
        padding: 0 0 0 69px;
        border: 0;
        border-radius: 999px;
        background: #fff;
        color: #111;
        font: inherit;
        text-decoration: none;
        cursor: pointer;
        transition: background-color 160ms ease, transform 160ms ease;
      }

      .hero__action span {
        width: 136px;
        font-size: 20px;
        font-weight: 600;
        line-height: 24px;
        letter-spacing: -0.04em;
        white-space: nowrap;
      }

      .hero__action:hover {
        background: #e8eee8;
        transform: translateY(-2px);
      }

      .hero__action:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 5px;
      }

      @media (max-width: 760px) {
        .hero__content {
          display: flex;
          flex-direction: column;
          justify-content: center;
          gap: 20px;
          padding: 32px 24px;
        }

        .hero__intro,
        .hero__title,
        .hero__tagline,
        .hero__action {
          position: static;
          width: auto;
        }

        .hero__intro {
          max-width: 520px;
          font-size: clamp(18px, 4.8vw, 24px);
          line-height: 1.45;
        }

        .hero__title {
          font-size: clamp(54px, 12vw, 76px);
          line-height: 1.08;
          letter-spacing: -0.07em;
        }

        .hero__tagline {
          max-width: 460px;
          font-size: clamp(23px, 5.7vw, 30px);
          line-height: 1.35;
          white-space: normal;
        }

        .hero__action {
          flex: 0 0 52px;
          width: min(277px, 100%);
          height: 52px;
          padding-left: clamp(24px, 13vw, 69px);
        }

        .hero__action span {
          font-size: 22px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="hero">
      <div class="background" aria-hidden="true">
        <div class="background__slide is-active"></div>
        <div class="background__slide"></div>
        <div class="background__slide"></div>
        <div class="background__slide"></div>
        <div class="background__slide"></div>
        <div class="background__slide"></div>
        <div class="background__slide"></div>
        <div class="background__shade"></div>
      </div>

      <section class="hero__content" aria-labelledby="hero-title">
        <p class="hero__intro">
          몇 가지 질문에 답하고<br />
          당신이 만나게 될 미래의 지구를 확인해보세요.
        </p>
        <h1 class="hero__title" id="hero-title">Earth, After?</h1>
        <p class="hero__tagline">당신이 살아온 오늘, 그 다음의 지구는?</p>
        <button class="hero__action" type="button">
          <span>미래 확인하기 -&gt;</span>
        </button>
      </section>
    </main>

    <script>
      const photos = [
        "pexels-naro-k-670655635-26762537.jpg",
        "pexels-suju-31056200.jpg",
        "pexels-lezginepik-36749129.jpg",
        "pexels-wilmowski-4604815.jpg",
        "pexels-mehmetsutlas-30029023.jpg",
        "pexels-dons-min-2153756611-36521805.jpg",
        "pexels-matvei-2160105320-36626516.jpg",
      ];
      const slides = document.querySelectorAll(".background__slide");
      let activeSlide = 0;

      slides.forEach((slide, index) => {
        slide.style.backgroundImage = `url("assets/backgrounds/${photos[index]}")`;
      });

      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        window.setInterval(() => {
          slides[activeSlide].classList.remove("is-active");
          activeSlide = (activeSlide + 1) % slides.length;
          slides[activeSlide].classList.add("is-active");
        }, 5000);
      }
    </script>
  </body>
</html>
